# Meta-Guardian: protected service + SOC control plane.
#
#   docker compose up --build
#   open http://127.0.0.1:8000
#
# The physical edge sensor (webcam + USB via psutil) runs on the host, not here,
# because a container cannot observe host devices. Everything else - the target
# service, detection, policy gate, MCP containment, forensics and live patching -
# runs inside this stack and is exercised by scripts/trigger_attack.py.

name: meta-guardian

services:
  target-api:
    build:
      context: .
    image: meta-guardian:local
    command: ["python", "-m", "backend.target_service"]
    environment:
      HOST: 0.0.0.0
      TARGET_PORT: "8001"
      # Same file the control plane tails; shared through the ./data volume.
      MG_TARGET_LOG: /app/data/runtime/target_requests.jsonl
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-token}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-1}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  soc-cockpit:
    build:
      context: .
    image: meta-guardian:local
    command: ["python", "-m", "backend.main"]
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # Container DNS name, not 127.0.0.1.
      TARGET_HOST: target-api
      TARGET_PORT: "8001"
      ENABLE_WATCHERS: "1"
      LLM_MODE: ${LLM_MODE:-mock}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-token}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      BASETEN_BASE_URL: ${BASETEN_BASE_URL:-https://inference.baseten.co/v1}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      OODA_MODEL: ${OODA_MODEL:-muse-glimmer}
      FORENSICS_MODEL: ${FORENSICS_MODEL:-muse-spark-1.3}
      SAM_MODEL: ${SAM_MODEL:-sam-3.1}
      SPARK_OPEN_MODEL: ${SPARK_OPEN_MODEL:-meta-models/muse-spark-open-1026}
      MODAL_SAM_URL: ${MODAL_SAM_URL:-}
      MODAL_SAM_TOKEN: ${MODAL_SAM_TOKEN:-}
      MODAL_SAM_TIMEOUT: ${MODAL_SAM_TIMEOUT:-180}
      SEGMENTATION_ASYNC: ${SEGMENTATION_ASYNC:-1}
      DEMO_ATTACKER_IP: ${DEMO_ATTACKER_IP:-203.0.113.66}
      ATTACK_COOLDOWN_SECONDS: ${ATTACK_COOLDOWN_SECONDS:-10}
      PERSIST_INCIDENTS: "1"
      # No camera inside the container: presence stays "unknown" and the policy
      # gate downgrades any ghost claim to human approval. Calibrate on the host.
      BASELINE_FRAME: /app/data/scenarios/diff_pair/baseline.png
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./quarantine:/app/quarantine
    # The image runs as uid 10001. On Linux bind mounts keep host ownership, so
    # if the container cannot write, either `sudo chown -R 10001 data quarantine`
    # or uncomment the next line for local-only use:
    # user: "0:0"
    depends_on:
      target-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
